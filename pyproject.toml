[project]
name = "ai-share-price-predictor"
version = "0.1.0"
description = "Machine learning share price forecasts with a FastAPI backend and dashboard frontend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
